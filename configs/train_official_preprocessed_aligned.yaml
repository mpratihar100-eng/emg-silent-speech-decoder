inherit: configs/base_official_aligned.yaml

paths:
  internal_root: data/preprocessed_official

data:
  include_prefixes: ["prep"]
  exclude_prefixes: []
  require_alignment_path: true

alignment:
  require_alignment: true

train:
  epochs: 20
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.0001
  clip_grad_norm: 5.0
  device: auto
